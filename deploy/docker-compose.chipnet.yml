# Chipnet stack. Runs alongside the mainnet one on the same host.
#
# A separate stack rather than an env flag on the existing one, because no table
# in the schema carries a network column: the database is implicitly single-network
# and mixing the two is unrecoverable. The indexer refuses to start against a
# database recorded as a different chain, so a stray DATABASE_URL fails loudly
# instead of quietly corrupting mainnet state.
#
#   docker compose -f docker-compose.chipnet.yml -p flowguard-chipnet up -d --build
#
# The -p is not optional. Without it Compose reuses the default project name and
# adopts the mainnet containers.
#
# Reads ./backend/.env.chipnet, which must point DATABASE_URL at a database used by
# nothing else. See deploy/README.md.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: ./backend/.env.chipnet
    environment:
      NODE_ENV: production
      BCH_NETWORK: chipnet
      PORT: "3002"
      INDEXER_STATUS_URL: "http://indexer:8080/status"
    # Loopback only; Caddy fronts it as chipnet-api.flowguard.cash.
    # Port differs from mainnet's 3001 so both can bind the host.
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      - indexer
    restart: unless-stopped
    # Lower than mainnet's 1200m: same image, but chipnet carries test traffic.
    mem_limit: 700m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  indexer:
    build:
      context: .
      dockerfile: Dockerfile.indexer
    env_file: ./backend/.env.chipnet
    environment:
      NODE_ENV: production
      BCH_NETWORK: chipnet
      # Explicit, as on mainnet: the indexer falls back to PORT when STATUS_PORT is
      # unset, and the shared env file sets PORT for the backend.
      STATUS_PORT: "8080"
      # Chipnet has one public Electrum server, and it is WSS on 50004 rather than
      # the TLS-TCP 50002 the mainnet servers use.
      ELECTRUM_SERVERS: "chipnet.imaginary.cash:50004"
    restart: unless-stopped
    # The indexer subscribes to covenant scripthashes rather than scanning blocks,
    # so a chipnet instance with an empty registry costs almost nothing. Mainnet's
    # runs at well under 1% CPU and 32MB.
    mem_limit: 400m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
